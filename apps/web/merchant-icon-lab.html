<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merchant Icon Lab</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
      body { margin: 0; background: #111827; color: #f9fafb; }
      main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { margin-bottom: 8px; }
      p { color: #cbd5e1; line-height: 1.5; }
      form { display: flex; gap: 10px; margin: 24px 0; }
      input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: inherit; font-size: 16px; }
      button { padding: 12px 16px; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
      .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
      .examples button { padding: 7px 10px; font-weight: 500; }
      .card { border: 1px solid #334155; background: #0f172a; border-radius: 12px; padding: 20px; }
      .summary { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; align-items: start; }
      .label { color: #94a3b8; }
      .icon-row { display: flex; align-items: center; gap: 18px; margin-top: 20px; }
      .icon-box { width: 96px; height: 96px; border-radius: 16px; background: #fff; display: grid; place-items: center; overflow: hidden; }
      .icon-box img { width: 100%; height: 100%; object-fit: contain; }
      .candidate-list { margin-top: 18px; font-size: 14px; color: #cbd5e1; }
      .candidate-list code { overflow-wrap: anywhere; }
      .ok { color: #86efac; }
      .bad { color: #fca5a5; }
      .muted { color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Merchant Icon Lab</h1>
      <p>Standalone Phase 1 acceptance harness. It does not open a budget or SQLite database. Enter a raw payee string to test strict merchant identity, official-domain metadata discovery, image validation, and the development fetch boundary.</p>
      <form id="merchant-form">
        <input id="merchant-input" autocomplete="off" value="Coles" aria-label="Raw payee" />
        <button type="submit">Resolve &amp; fetch</button>
      </form>
      <div class="examples" id="examples"></div>
      <section class="card" id="result">Ready.</section>
    </main>
    <script type="module" src="/src/merchantIconLab.ts"></script>
  </body>
</html>
