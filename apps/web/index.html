<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const validThemes = ["light", "dark", "blueprint", "system"];
        let theme = "system";
        try {
          const storedTheme = window.localStorage.getItem("budget-app-theme");
          if (validThemes.includes(storedTheme)) theme = storedTheme;
        } catch {
          // Restricted storage behaves like an unset preference.
        }
        const resolvedTheme = theme === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : theme;
        document.documentElement.dataset.theme = resolvedTheme;
        document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
      })();
    </script>
    <title>Budget App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
