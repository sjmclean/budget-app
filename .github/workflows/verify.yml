name: Verify

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      reconciliation_benchmark:
        description: "Run disposable 15,000-transaction reconciliation benchmark"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Canonical verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run P0.6 projection benchmark
        run: pnpm benchmark:p0-6:projection
      - name: Run P0.6 large projection benchmark
        run: pnpm benchmark:p0-6:projection:large
      - name: Run local-first sync benchmark
        run: pnpm benchmark:local-first-sync
      - name: Run local-first large sync benchmark
        run: pnpm benchmark:local-first-sync:large
      - name: Upload P0.6 projection benchmark
        uses: actions/upload-artifact@v4
        with:
          name: p0-6-projection-benchmark
          path: test-results/p0-6-projection-benchmark*.json
          if-no-files-found: error
          retention-days: 7
      - name: Run canonical verification
        run: pnpm verify
      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: |
            test-results/local-first-sync-performance*.json
            test-results/browser-local-sqlite-performance.json
            test-results/actual-import-performance.json
            test-results/navigation-performance.json
            test-results/large-register-ui-performance.json
            apps/web/dist/performance-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Confirm verification did not mutate tracked files
        run: git diff --exit-code
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-required-tests:
    name: Required tests on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run required tests
        run: pnpm test:required

  reconciliation-benchmark:
    name: Reconciliation large-account benchmark
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reconciliation_benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run disposable reconciliation benchmark
        env:
          BUDGET_APP_RECONCILIATION_BENCHMARK: "1"
          BUDGET_APP_RECONCILIATION_BENCHMARK_COUNT: "15000"
          BUDGET_APP_E2E_ISOLATED_PORTS: "1"
        run: pnpm exec playwright test tests/e2e/reconciliation-large-benchmark.spec.ts --project=chromium --workers=1
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-benchmark-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
