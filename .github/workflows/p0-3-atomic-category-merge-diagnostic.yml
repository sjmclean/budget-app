name: P0.3 Atomic Category Merge Diagnostic

on:
  push:
    branches:
      - audit/p0-3-command-engine-current

permissions:
  contents: write

jobs:
  diagnose-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/p0-3-command-engine-current
          fetch-depth: 0

      - name: Reuse exact correction patch
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/p0-3-atomic-category-merge-fix.yml').read_text().splitlines()
          marker = '      - name: Apply atomic category merge correction'
          start = workflow.index(marker)
          run_index = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '        run: |')
          end = next(i for i in range(run_index + 1, len(workflow)) if workflow[i].startswith('      - name: '))
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[run_index + 1:end])
          exec(compile(code, '<atomic-category-merge-patch>', 'exec'))

          # The original diagnostic index matched the earlier Category Goal write.
          # Target the budget-month write in the same worker transaction explicitly.
          test_path = Path('tests/unit/persistence/local-first-category-merge-integrity.test.ts')
          test_text = test_path.read_text()
          old = 'const budgetWriteIndex = merge.indexOf("writeNormalisedDomainEntity(");'
          new = 'const budgetWriteIndex = merge.indexOf(\'"budgetMonths"\', deleteIndex);'
          if test_text.count(old) != 1:
              raise SystemExit(f'Expected one fragile budgetWriteIndex assertion, found {test_text.count(old)}')
          test_path.write_text(test_text.replace(old, new, 1))

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static check
        run: pnpm static:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Required tests
        run: pnpm test:required

      - name: Web build
        run: pnpm test:web-build

      - name: Architecture docs check
        run: pnpm docs:architecture:check

      - name: Performance analysis
        run: pnpm performance:analyze

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: CI=1 pnpm test:e2e

      - name: Canonical verify
        run: CI=1 pnpm verify

      - name: Confirm only intended source/test files changed
        run: |
          git status --short
          test -z "$(git status --short | grep -v '^?? .github/workflows/p0-3-atomic-category-merge-diagnostic.yml$' | grep -v '^?? .github/workflows/p0-3-atomic-category-merge-fix.yml$' | grep -v -E '^( M|M ) (apps/web/src/features/persistence/localFirst/contracts.ts|apps/web/src/features/persistence/localFirst/localBudgetClient.ts|apps/web/src/features/persistence/localFirst/localBudget.worker.ts|apps/web/src/features/persistence/localFirst/engine/budgetCategoryCommands.ts|tests/unit/persistence/budget-category-command-integrity.test.ts|tests/unit/persistence/local-first-category-merge-integrity.test.ts)$' || true)"

      - name: Commit verified correction and remove temporary workflows
        run: |
          rm .github/workflows/p0-3-atomic-category-merge-fix.yml
          rm .github/workflows/p0-3-atomic-category-merge-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): make category merge command atomic"
          git push origin HEAD:audit/p0-3-command-engine-current
