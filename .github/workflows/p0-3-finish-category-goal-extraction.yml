name: P0.3 Finish Category Goal Extraction

on:
  push:
    branches:
      - audit/p0-3-command-engine-current

permissions:
  contents: write

jobs:
  extract-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/p0-3-command-engine-current
          fetch-depth: 0

      - name: Wire Category Goal commands and enforcement
        shell: python
        run: |
          from pathlib import Path
          import re

          runtime_path = Path("apps/web/src/features/persistence/localFirst/localFirstAccountRegisterClient.ts")
          runtime = runtime_path.read_text()

          old_import = '''import {
            categoryGoalsEqual,
            commitCategoryGoalMutation,
            normaliseCategoryGoalForPersistence,
          } from "./categoryGoalPersistence";
          '''
          if old_import not in runtime:
              raise SystemExit("Expected Category Goal persistence import block not found")
          runtime = runtime.replace(old_import, "", 1)

          anchor = 'import { createBudgetCategoryCommands } from "./engine/budgetCategoryCommands";\n'
          if runtime.count(anchor) != 1:
              raise SystemExit("Expected budget/category command import anchor once")
          runtime = runtime.replace(
              anchor,
              anchor + 'import { createCategoryGoalCommands } from "./engine/categoryGoalCommands";\n',
              1,
          )

          anchor = '''  const budgetCategoryCommands = createBudgetCategoryCommands({
            requireDatabase,
            createMutation: mutation,
            recordCommittedChange: notifyLocalFirstMutationCommitted,
          });
          '''
          if runtime.count(anchor) != 1:
              raise SystemExit("Expected budget/category command construction once")
          runtime = runtime.replace(
              anchor,
              anchor + '''  const categoryGoalCommands = createCategoryGoalCommands({
            requireDatabase,
            createMutation: mutation,
            discardFailedMutation: mutationContext.discardFailedMutation.bind(mutationContext),
            recordCommittedChange: notifyLocalFirstMutationCommitted,
          });
          ''',
              1,
          )

          pattern = re.compile(
              r'    async createCategoryGoal\(goal\) \{[\s\S]*?\n    createAccount: accountCommands\.createAccount,',
          )
          match = pattern.search(runtime)
          if not match:
              raise SystemExit("Expected runtime-owned Category Goal command block not found")
          replacement = '''    createCategoryGoal: categoryGoalCommands.createCategoryGoal,
            updateCategoryGoal: categoryGoalCommands.updateCategoryGoal,
            deleteCategoryGoal: categoryGoalCommands.deleteCategoryGoal,
            replaceCategoryGoalHistoryState: categoryGoalCommands.replaceCategoryGoalHistoryState,
            createAccount: accountCommands.createAccount,'''
          runtime = runtime[:match.start()] + replacement + runtime[match.end():]
          runtime_path.write_text(runtime)

          boundary_path = Path("tests/unit/persistence/local-budget-engine-boundary.test.ts")
          boundary = boundary_path.read_text()
          if 'all ordinary Category Goal implementations are engine-module owned' not in boundary:
              boundary += '''

test("all ordinary Category Goal implementations are engine-module owned", () => {
  const runtime = readFileSync(resolve(root, "features/persistence/localFirst/localFirstAccountRegisterClient.ts"), "utf8");
  const commands = readFileSync(resolve(root, "features/persistence/localFirst/engine/categoryGoalCommands.ts"), "utf8");
  for (const method of [
    "createCategoryGoal",
    "updateCategoryGoal",
    "deleteCategoryGoal",
    "replaceCategoryGoalHistoryState",
  ]) {
    assert.match(runtime, new RegExp(`${method}: categoryGoalCommands\\\\.${method}`));
    assert.doesNotMatch(runtime, new RegExp(`async ${method}\\\\s*\\\\(`));
    assert.match(commands, new RegExp(`async ${method}\\\\s*\\\\(`));
  }
  const runtimeClient = runtime.slice(runtime.indexOf("  const client:"));
  assert.doesNotMatch(
    runtimeClient,
    /local\\.(?:writeCategoryGoal|deleteCategoryGoal|replaceCategoryGoalHistoryState)\\s*\\(/,
  );
  assert.doesNotMatch(runtime, /commitCategoryGoalMutation|normaliseCategoryGoalForPersistence|categoryGoalsEqual/);
  assert.doesNotMatch(commands, /\\bsynchronise\\b/);
  assert.match(commands, /discardFailedMutation\\(mutation\\.mutationId\\)/);
});
'''
          boundary_path.write_text(boundary)

          inventory_path = Path("docs/architecture/local-budget-engine-command-inventory.md")
          inventory = inventory_path.read_text()
          inventory = inventory.replace(
              '- Still runtime-owned: goals, payees, scheduled transactions, remaining\n  history/import commands, and keep-local conflict replay.',
              '- Category goals: complete in `engine/categoryGoalCommands.ts`.\n- Still runtime-owned: payees, scheduled transactions, remaining history/import\n  commands, and keep-local conflict replay.',
          )
          inventory = inventory.replace(
              'Category goals remain runtime-owned and are\nnot part of this extraction.',
              'Category goals are now physically owned by `engine/categoryGoalCommands.ts`.',
          )
          inventory = inventory.replace(
              '| Category goals | Engine/executor | Runtime-owned |',
              '| Category goals | Engine/executor | Extracted Category Goal module |',
          )
          if '### Extracted Category Goal handlers' not in inventory:
              marker = 'Their domain return values are preserved. At this checkpoint, domain operations\n'
              section = '''### Extracted Category Goal handlers

| Command | Final module | Final handler |
| --- | --- | --- |
| Goal create | `engine/categoryGoalCommands.ts` | `createCategoryGoal` |
| Goal update | `engine/categoryGoalCommands.ts` | `updateCategoryGoal` |
| Goal delete | `engine/categoryGoalCommands.ts` | `deleteCategoryGoal` |
| Exact Goal history replacement | `engine/categoryGoalCommands.ts` | `replaceCategoryGoalHistoryState` |

Goal normalization remains shared persistence policy in `categoryGoalPersistence.ts`;
ordinary command orchestration, mutation allocation, no-op mutation accounting,
and scoped change recording are engine-module owned.

'''
              if marker not in inventory:
                  raise SystemExit("Expected inventory insertion marker not found")
              inventory = inventory.replace(marker, section + marker, 1)
          inventory_path.write_text(inventory)

          test_path = Path("tests/unit/persistence/category-goal-command-integrity.test.ts")
          test_path.write_text('''import assert from "node:assert/strict";
import test from "node:test";
import type { CategoryGoal } from "../../../packages/types/src/CategoryGoal.js";
import { flushPersistenceChanges, subscribePersistenceChanges } from "../../../apps/web/src/features/persistence/persistenceChangeBus.js";
import type { LocalBudgetMutation } from "../../../apps/web/src/features/persistence/localFirst/contracts.js";
import { createCategoryGoalCommands } from "../../../apps/web/src/features/persistence/localFirst/engine/categoryGoalCommands.js";
import { LocalBudgetCommandContext } from "../../../apps/web/src/features/persistence/localFirst/engine/commandContext.js";
import { createDomainCommandHandler } from "../../../apps/web/src/features/persistence/localFirst/engine/domainCommandHandlers.js";
import { LocalBudgetCommandExecutor } from "../../../apps/web/src/features/persistence/localFirst/engine/localBudgetCommandExecutor.js";
import { LocalBudgetMutationContext } from "../../../apps/web/src/features/persistence/localFirst/engine/mutationContext.js";
import type { LocalBudgetDatabaseClient } from "../../../apps/web/src/features/persistence/localFirst/localBudgetClient.js";

const budgetId = "budget-a";
const categoryId = "category-a";
const goal: CategoryGoal = {
  id: "goal-a",
  budgetId,
  categoryId,
  type: "monthly-funding",
  targetAmount: 100,
  targetMonth: null,
  createdAt: "2026-09-17T00:00:00.000Z",
  updatedAt: "2026-09-17T00:00:00.000Z",
};

function harness(options: { missingDelete?: boolean; noOpHistory?: boolean } = {}) {
  const committed: LocalBudgetMutation[] = [];
  const storage = new Map<string, string>();
  const mutations = new LocalBudgetMutationContext({
    storage: { getItem: (key) => storage.get(key) ?? null, setItem: (key, value) => { storage.set(key, value); } },
    deviceId: "device-a", currentSyncEpoch: () => "epoch-a", currentBaseCursor: () => 3,
  });
  const context = new LocalBudgetCommandContext(mutations);
  const database = {
    async writeCategoryGoal(_mode: string, value: CategoryGoal, mutation: LocalBudgetMutation) {
      committed.push(mutation);
      return value;
    },
    async deleteCategoryGoal(_budgetId: string, _categoryId: string, mutation: LocalBudgetMutation) {
      if (options.missingDelete) return null;
      committed.push(mutation);
      return goal;
    },
    async replaceCategoryGoalHistoryState(input: {
      expected: CategoryGoal | null;
      replacement: CategoryGoal | null;
      mutation: LocalBudgetMutation;
    }) {
      if (!options.noOpHistory) committed.push(input.mutation);
      return input.replacement;
    },
  } as unknown as LocalBudgetDatabaseClient;
  const commands = createCategoryGoalCommands({
    requireDatabase: async () => database,
    createMutation: mutations.createMutation.bind(mutations),
    discardFailedMutation: mutations.discardFailedMutation.bind(mutations),
    recordCommittedChange: context.recordCommittedChange.bind(context),
  });
  return { committed, commands, context };
}

async function execute<T>(context: LocalBudgetCommandContext, operation: () => Promise<T>) {
  let publications = 0;
  const unsubscribe = subscribePersistenceChanges(() => { publications += 1; });
  try {
    const result = await new LocalBudgetCommandExecutor().execute(
      "goal:test",
      createDomainCommandHandler({ budgetId, context, operation }),
    );
    flushPersistenceChanges();
    return { result, publications };
  } finally {
    unsubscribe();
  }
}

test("Category Goal create result contains exactly the committed worker mutation", async () => {
  const state = harness();
  const { result, publications } = await execute(state.context, () => state.commands.createCategoryGoal(goal));
  assert.deepEqual(result.mutationIds, state.committed.map(({ mutationId }) => mutationId));
  assert.equal(state.committed.length, 1);
  assert.deepEqual(result.change.domains, ["budget", "goals"]);
  assert.deepEqual(result.change.categoryIds, [categoryId]);
  assert.equal(publications, 1);
});

test("missing Goal delete excludes the uncommitted mutation from a successful command result", async () => {
  const state = harness({ missingDelete: true });
  const { result, publications } = await execute(state.context, () => state.commands.deleteCategoryGoal({ budgetId, categoryId }));
  assert.equal(result.result, null);
  assert.deepEqual(result.mutationIds, []);
  assert.deepEqual(state.committed, []);
  assert.equal(publications, 0);
});

test("no-op Goal history replacement verifies state without reporting an uncommitted mutation", async () => {
  const state = harness({ noOpHistory: true });
  const { result, publications } = await execute(state.context, () => state.commands.replaceCategoryGoalHistoryState({
    budgetId,
    categoryId,
    expected: goal,
    replacement: goal,
  }));
  assert.deepEqual(result.mutationIds, []);
  assert.deepEqual(state.committed, []);
  assert.equal(publications, 0);
});
''')

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate
        run: |
          pnpm static:check
          pnpm typecheck
          pnpm test:required
          CI=1 pnpm verify

      - name: Commit verified extraction
        shell: bash
        run: |
          rm .github/workflows/p0-3-finish-category-goal-extraction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor(web): extract Category Goal commands"
          git push origin HEAD:audit/p0-3-command-engine-current
