name: P0.3 Goal Extraction

on:
  push:
    branches:
      - audit/p0-3-command-engine-current

permissions:
  contents: write

jobs:
  extract-verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/p0-3-command-engine-current
          fetch-depth: 0

      - name: Extract Category Goal commands
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          module = root / 'apps/web/src/features/persistence/localFirst/engine/categoryGoalCommands.ts'
          if module.exists():
              raise SystemExit('categoryGoalCommands.ts already exists')
          module.write_text('''import type { LocalBudgetRuntimeClient } from "../../accountRegisterQueryContracts";
          import type { PersistenceChangeScope } from "../../persistenceChangeBus";
          import {
            categoryGoalsEqual,
            commitCategoryGoalMutation,
            normaliseCategoryGoalForPersistence,
          } from "../categoryGoalPersistence";
          import type { LocalBudgetMutation, LocalBudgetOperationGroup } from "../contracts";
          import type { LocalBudgetDatabaseClient } from "../localBudgetClient";

          type CategoryGoalCommands = Pick<
            LocalBudgetRuntimeClient,
            | "createCategoryGoal"
            | "updateCategoryGoal"
            | "deleteCategoryGoal"
            | "replaceCategoryGoalHistoryState"
          >;

          type CreateMutation = (
            budgetId: string,
            domain: LocalBudgetMutation["domain"],
            entityId: string,
            operation: LocalBudgetMutation["operation"],
            payload: unknown,
            operationGroupId?: string,
            operationGroup?: LocalBudgetOperationGroup,
          ) => LocalBudgetMutation;

          export interface CategoryGoalCommandDependencies {
            readonly requireDatabase: (budgetId: string) => Promise<LocalBudgetDatabaseClient>;
            readonly createMutation: CreateMutation;
            readonly recordCommittedChange: (
              budgetId: string,
              change: Omit<PersistenceChangeScope, "budgetId">,
            ) => void;
          }

          /** Final implementation owner for ordinary Category Goal commands. */
          export function createCategoryGoalCommands(
            dependencies: CategoryGoalCommandDependencies,
          ): CategoryGoalCommands {
            const recordGoalChange = (budgetId: string, categoryId?: string) => {
              dependencies.recordCommittedChange(budgetId, {
                domains: ["goals", "budget"],
                categoryIds: categoryId ? [categoryId] : undefined,
              });
            };

            return {
              async createCategoryGoal(goal) {
                const local = await dependencies.requireDatabase(goal.budgetId);
                const canonical = normaliseCategoryGoalForPersistence(goal);
                return commitCategoryGoalMutation(
                  goal.budgetId,
                  () => local.writeCategoryGoal(
                    "create",
                    canonical,
                    dependencies.createMutation(
                      goal.budgetId,
                      "categoryGoals",
                      goal.categoryId,
                      "upsert",
                      canonical,
                    ),
                  ),
                  undefined,
                  goal.categoryId,
                  recordGoalChange,
                );
              },

              async updateCategoryGoal(goal) {
                const local = await dependencies.requireDatabase(goal.budgetId);
                const canonical = normaliseCategoryGoalForPersistence(goal);
                return commitCategoryGoalMutation(
                  goal.budgetId,
                  () => local.writeCategoryGoal(
                    "update",
                    canonical,
                    dependencies.createMutation(
                      goal.budgetId,
                      "categoryGoals",
                      goal.categoryId,
                      "upsert",
                      canonical,
                    ),
                  ),
                  undefined,
                  goal.categoryId,
                  recordGoalChange,
                );
              },

              async deleteCategoryGoal(input) {
                const local = await dependencies.requireDatabase(input.budgetId);
                return commitCategoryGoalMutation(
                  input.budgetId,
                  () => local.deleteCategoryGoal(
                    input.budgetId,
                    input.categoryId,
                    dependencies.createMutation(
                      input.budgetId,
                      "categoryGoals",
                      input.categoryId,
                      "delete",
                      null,
                    ),
                  ),
                  (result) => result !== null,
                  input.categoryId,
                  recordGoalChange,
                );
              },

              async replaceCategoryGoalHistoryState(input) {
                const local = await dependencies.requireDatabase(input.budgetId);
                const replacement = input.replacement
                  ? normaliseCategoryGoalForPersistence(input.replacement)
                  : null;
                return commitCategoryGoalMutation(
                  input.budgetId,
                  () => local.replaceCategoryGoalHistoryState({
                    ...input,
                    replacement,
                    mutation: dependencies.createMutation(
                      input.budgetId,
                      "categoryGoals",
                      input.categoryId,
                      replacement ? "upsert" : "delete",
                      replacement,
                    ),
                  }),
                  () => !categoryGoalsEqual(input.expected, replacement),
                  input.categoryId,
                  recordGoalChange,
                );
              },
            };
          }
          '''.replace('          ', ''))

          runtime_path = root / 'apps/web/src/features/persistence/localFirst/localFirstAccountRegisterClient.ts'
          runtime = runtime_path.read_text()
          old_goal_import = '''import {
            categoryGoalsEqual,
            commitCategoryGoalMutation,
            normaliseCategoryGoalForPersistence,
          } from "./categoryGoalPersistence";
          '''.replace('          ', '')
          if runtime.count(old_goal_import) != 1:
              raise SystemExit('Expected one runtime Category Goal helper import')
          runtime = runtime.replace(old_goal_import, '', 1)

          anchor = 'import { createBudgetCategoryCommands } from "./engine/budgetCategoryCommands";\n'
          replacement = anchor + 'import { createCategoryGoalCommands } from "./engine/categoryGoalCommands";\n'
          if runtime.count(anchor) != 1:
              raise SystemExit('Expected budgetCategoryCommands import anchor')
          runtime = runtime.replace(anchor, replacement, 1)

          constructor_anchor = '''  const budgetCategoryCommands = createBudgetCategoryCommands({
            requireDatabase,
            createMutation: mutation,
            recordCommittedChange: notifyLocalFirstMutationCommitted,
          });
          '''.replace('          ', '')
          constructor_replacement = constructor_anchor + '''  const categoryGoalCommands = createCategoryGoalCommands({
            requireDatabase,
            createMutation: mutation,
            recordCommittedChange: notifyLocalFirstMutationCommitted,
          });
          '''.replace('          ', '')
          if runtime.count(constructor_anchor) != 1:
              raise SystemExit('Expected budget/category constructor anchor')
          runtime = runtime.replace(constructor_anchor, constructor_replacement, 1)

          start = runtime.index('    async createCategoryGoal(goal) {')
          end = runtime.index('    createAccount: accountCommands.createAccount,', start)
          delegates = '''    createCategoryGoal: categoryGoalCommands.createCategoryGoal,
              updateCategoryGoal: categoryGoalCommands.updateCategoryGoal,
              deleteCategoryGoal: categoryGoalCommands.deleteCategoryGoal,
              replaceCategoryGoalHistoryState: categoryGoalCommands.replaceCategoryGoalHistoryState,
          '''.replace('          ', '')
          runtime = runtime[:start] + delegates + runtime[end:]
          runtime_path.write_text(runtime)

          boundary_path = root / 'tests/unit/persistence/local-budget-engine-boundary.test.ts'
          boundary = boundary_path.read_text()
          boundary += '''

          test("all ordinary Category Goal implementations are engine-module owned", () => {
            const runtime = readFileSync(resolve(root, "features/persistence/localFirst/localFirstAccountRegisterClient.ts"), "utf8");
            const commands = readFileSync(resolve(root, "features/persistence/localFirst/engine/categoryGoalCommands.ts"), "utf8");
            for (const method of [
              "createCategoryGoal",
              "updateCategoryGoal",
              "deleteCategoryGoal",
              "replaceCategoryGoalHistoryState",
            ]) {
              assert.match(runtime, new RegExp(`${method}: categoryGoalCommands\\.${method}`));
              assert.doesNotMatch(runtime, new RegExp(`async ${method}\\s*\\(`));
              assert.match(commands, new RegExp(`async ${method}\\s*\\(`));
            }
            assert.doesNotMatch(runtime, /normaliseCategoryGoalForPersistence|commitCategoryGoalMutation|categoryGoalsEqual/);
            assert.match(commands, /local\\.writeCategoryGoal\\s*\\(/);
            assert.match(commands, /local\\.deleteCategoryGoal\\s*\\(/);
            assert.match(commands, /local\\.replaceCategoryGoalHistoryState\\s*\\(/);
            assert.doesNotMatch(commands, /\\bsynchronise\\b/);
          });
          '''.replace('          ', '')
          boundary_path.write_text(boundary)

          integrity = root / 'tests/unit/persistence/category-goal-command-integrity.test.ts'
          integrity.write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import type { CategoryGoal } from "../../../packages/types/src/CategoryGoal.js";
          import { flushPersistenceChanges, subscribePersistenceChanges } from "../../../apps/web/src/features/persistence/persistenceChangeBus.js";
          import type { LocalBudgetMutation } from "../../../apps/web/src/features/persistence/localFirst/contracts.js";
          import { createCategoryGoalCommands } from "../../../apps/web/src/features/persistence/localFirst/engine/categoryGoalCommands.js";
          import { LocalBudgetCommandContext } from "../../../apps/web/src/features/persistence/localFirst/engine/commandContext.js";
          import { createDomainCommandHandler } from "../../../apps/web/src/features/persistence/localFirst/engine/domainCommandHandlers.js";
          import { LocalBudgetCommandExecutor } from "../../../apps/web/src/features/persistence/localFirst/engine/localBudgetCommandExecutor.js";
          import { LocalBudgetMutationContext } from "../../../apps/web/src/features/persistence/localFirst/engine/mutationContext.js";
          import type { LocalBudgetDatabaseClient } from "../../../apps/web/src/features/persistence/localFirst/localBudgetClient.js";

          const budgetId = "budget-a";
          const categoryId = "category-a";
          const goal: CategoryGoal = {
            id: "goal-a",
            budgetId,
            categoryId,
            type: "monthly-funding",
            targetAmount: 125,
            targetMonth: null,
            createdAt: "2026-09-01T00:00:00.000Z",
            updatedAt: "2026-09-01T00:00:00.000Z",
          };

          function harness(options: { failWrite?: boolean } = {}) {
            const committed: LocalBudgetMutation[] = [];
            const storage = new Map<string, string>();
            const mutations = new LocalBudgetMutationContext({
              storage: { getItem: (key) => storage.get(key) ?? null, setItem: (key, value) => { storage.set(key, value); } },
              deviceId: "device-a", currentSyncEpoch: () => "epoch-a", currentBaseCursor: () => 7,
            });
            const context = new LocalBudgetCommandContext(mutations);
            const database = {
              async writeCategoryGoal(_mode: "create" | "update", value: CategoryGoal, mutation: LocalBudgetMutation) {
                if (options.failWrite) throw new Error("goal worker rollback");
                committed.push(mutation);
                return structuredClone(value);
              },
              async deleteCategoryGoal(_budgetId: string, _categoryId: string, mutation: LocalBudgetMutation) {
                committed.push(mutation);
                return structuredClone(goal);
              },
              async replaceCategoryGoalHistoryState(input: { replacement: CategoryGoal | null; mutation: LocalBudgetMutation }) {
                committed.push(input.mutation);
                return structuredClone(input.replacement);
              },
            } as unknown as LocalBudgetDatabaseClient;
            const commands = createCategoryGoalCommands({
              requireDatabase: async () => database,
              createMutation: mutations.createMutation.bind(mutations),
              recordCommittedChange: context.recordCommittedChange.bind(context),
            });
            return { committed, commands, context };
          }

          async function execute<T>(context: LocalBudgetCommandContext, operation: () => Promise<T>) {
            let publications = 0;
            const unsubscribe = subscribePersistenceChanges(() => { publications += 1; });
            try {
              const result = await new LocalBudgetCommandExecutor().execute(
                "goal:test",
                createDomainCommandHandler({ budgetId, context, operation }),
              );
              flushPersistenceChanges();
              return { result, publications };
            } finally {
              unsubscribe();
            }
          }

          test("Category Goal command result contains exactly the committed mutation and scoped impact", async () => {
            const state = harness();
            const executed = await execute(state.context, () => state.commands.createCategoryGoal(goal));
            assert.deepEqual(executed.result.mutationIds, state.committed.map(({ mutationId }) => mutationId));
            assert.equal(state.committed.length, 1);
            assert.deepEqual(new Set(executed.result.change.domains), new Set(["goals", "budget"]));
            assert.deepEqual(executed.result.change.categoryIds, [categoryId]);
            assert.equal(executed.publications, 1);
          });

          test("Category Goal worker failure returns no result and publishes nothing", async () => {
            const state = harness({ failWrite: true });
            let publications = 0;
            const unsubscribe = subscribePersistenceChanges(() => { publications += 1; });
            await assert.rejects(
              () => new LocalBudgetCommandExecutor().execute(
                "goal:failed",
                createDomainCommandHandler({
                  budgetId,
                  context: state.context,
                  operation: () => state.commands.createCategoryGoal(goal),
                }),
              ),
              /goal worker rollback/,
            );
            flushPersistenceChanges();
            unsubscribe();
            assert.equal(state.committed.length, 0);
            assert.equal(publications, 0);
          });
          '''.replace('          ', ''))

          inventory_path = root / 'docs/architecture/local-budget-engine-command-inventory.md'
          inventory = inventory_path.read_text()
          inventory = inventory.replace(
              '- Budget months and categories: complete in\n  `engine/budgetCategoryCommands.ts` and `engine/categoryCommandHelpers.ts`.\n- Still runtime-owned: goals, payees, scheduled transactions, remaining\n  history/import commands, and keep-local conflict replay.',
              '- Budget months and categories: complete in\n  `engine/budgetCategoryCommands.ts` and `engine/categoryCommandHelpers.ts`.\n- Category goals: complete in `engine/categoryGoalCommands.ts`.\n- Still runtime-owned: payees, scheduled transactions, remaining history/import\n  commands, and keep-local conflict replay.',
          )
          inventory = inventory.replace(
              '| Category goals | Engine/executor | Runtime-owned |',
              '| Category goals | Engine/executor | Extracted Category Goal module |',
          )
          marker = 'Their domain return values are preserved. At this checkpoint, domain operations\n'
          section = '''### Extracted Category Goal handlers

          | Command | Final module | Final handler |
          | --- | --- | --- |
          | Category Goal create | `engine/categoryGoalCommands.ts` | `createCategoryGoal` |
          | Category Goal update | `engine/categoryGoalCommands.ts` | `updateCategoryGoal` |
          | Category Goal delete | `engine/categoryGoalCommands.ts` | `deleteCategoryGoal` |
          | Exact Category Goal history replacement | `engine/categoryGoalCommands.ts` | `replaceCategoryGoalHistoryState` |

          Category Goal queries remain on the read-only query path. Goal normalization,
          validation and equality remain shared persistence helpers, while ordinary command
          orchestration and scoped commit recording are engine-owned.

          '''.replace('          ', '')
          if marker not in inventory:
              raise SystemExit('Inventory insertion marker missing')
          inventory = inventory.replace(marker, section + marker, 1)
          inventory_path.write_text(inventory)

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run canonical verification
        env:
          CI: "1"
        run: pnpm verify
      - name: Confirm verification did not mutate tracked files
        run: git diff --exit-code
      - name: Commit extracted goal commands and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p0-3-goal-extraction.yml
          git add apps/web/src/features/persistence/localFirst/engine/categoryGoalCommands.ts \
                  apps/web/src/features/persistence/localFirst/localFirstAccountRegisterClient.ts \
                  tests/unit/persistence/local-budget-engine-boundary.test.ts \
                  tests/unit/persistence/category-goal-command-integrity.test.ts \
                  docs/architecture/local-budget-engine-command-inventory.md
          git commit -m "refactor(web): extract Category Goal commands"
          git push origin HEAD:audit/p0-3-command-engine-current
